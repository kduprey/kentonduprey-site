name: Release PR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    name: Create/update PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: id-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.id-token.outputs.token }}
          persist-credentials: false

      - name: Fetch production branch
        env:
          GH_TOKEN: ${{ steps.id-token.outputs.token }}
        run: git fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" production:refs/remotes/origin/production

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Build release PR body
        env:
          GH_TOKEN: ${{ steps.id-token.outputs.token }}
        run: node scripts/build-release-pr-body.mjs > release-pr-body.md

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ steps.id-token.outputs.token }}
        run: |
          PR_NUMBER=$(gh pr list --base production --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            gh pr create \
              --base production \
              --head main \
              --title "chore: Release $TIMESTAMP" \
              --body-file release-pr-body.md
          else
            gh pr edit "$PR_NUMBER" --body-file release-pr-body.md
          fi
