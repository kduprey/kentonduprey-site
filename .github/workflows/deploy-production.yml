name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Install dependencies
        # DATABASE_URL must be set before install: packages/db's postinstall
        # runs `prisma generate`, which resolves it eagerly via prisma.config.ts.
        run: |
          set -a
          . ./.vercel/.env.production.local
          set +a
          pnpm install

      - name: Apply pending migrations
        run: |
          set -a
          . ./.vercel/.env.production.local
          set +a
          pnpm --filter @kduprey/db migrate:deploy

  deploy:
    needs: migrate
    strategy:
      matrix:
        include:
          - app: frontend
            project_id_var: VERCEL_PROJECT_ID_FRONTEND
          - app: admin
            project_id_var: VERCEL_PROJECT_ID_ADMIN
          - app: cms
            project_id_var: VERCEL_PROJECT_ID_CMS
    name: Deploy ${{ matrix.app }} to Vercel (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars[matrix.project_id_var] }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
